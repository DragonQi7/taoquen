<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>龍之道闖關學習——學習 Lu 大師的教導</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02; --green-dk:#46a302; --green-lt:#d7ffb8;
  --blue:#1cb0f6; --blue-dk:#1899d6; --blue-lt:#ddf4ff;
  --red:#ff4b4b; --red-dk:#ea2b2b; --red-lt:#ffdfe0;
  --gold:#ffc800; --gold-dk:#e6a800;
  --purple:#ce82ff; --purple-dk:#a568cc;
  --teal:#00cd9c; --teal-dk:#00a47d;
  --orange:#ff9600; --orange-dk:#e08600;
  --ink:#4b4b4b; --ink-lt:#777; --line:#e5e5e5; --bg:#fbfbf3;
  --disabled:#e5e5e5; --disabled-ink:#afafaf;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Nunito',-apple-system,'Segoe UI',Noto Sans TC,system-ui,sans-serif;
  font-weight:700; font-size:17px; line-height:1.45;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}
.screen{display:none;padding-bottom:40px;}
.screen.active{display:block;}
button{font-family:inherit;font-weight:800;cursor:pointer;border:none;}

/* ============ 3D buttons ============ */
.btn{
  display:inline-block;width:100%;padding:14px 18px;border-radius:14px;
  font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:#fff;
  background:var(--green);box-shadow:0 4px 0 var(--green-dk);
  transition:filter .12s;user-select:none;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-dk);}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dk);}
.btn.blue:active{box-shadow:0 0 0 var(--blue-dk);}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-dk);}
.btn.red:active{box-shadow:0 0 0 var(--red-dk);}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);}
.btn.ghost:active{box-shadow:0 0 0 var(--line);}
.btn:disabled{background:var(--disabled);color:var(--disabled-ink);box-shadow:0 4px 0 #d0d0d0;cursor:default;}
.btn:disabled:active{transform:none;}

/* ============ Home header ============ */
.top-stats{
  position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;
  padding:12px 16px;background:rgba(251,251,243,.94);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.stat-pill{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:900;padding:4px 8px;border-radius:10px;}
.stat-pill .em{font-size:18px;}
.stat-streak{color:#ff9600;}
.stat-xp{color:#1cb0f6;}
.stat-lvl{margin-left:auto;color:#fff;background:var(--purple);box-shadow:0 2px 0 var(--purple-dk);font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;}
.snd-btn{background:none;font-size:18px;padding:2px 4px;}
.flame-on{animation:flamePulse 1.6s infinite;}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25) rotate(-4deg)}}

.hero{display:flex;align-items:center;gap:14px;padding:18px 20px 6px;}
.hero h1{font-size:22px;font-weight:900;margin:0;color:#3c3c3c;}
.hero p{margin:2px 0 0;font-size:14px;color:var(--ink-lt);}
.daily{margin:10px 20px 4px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;}
.daily .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-lt);font-weight:800;}
.bar{height:12px;background:#eee;border-radius:8px;overflow:hidden;margin-top:6px;}
.bar>div{height:100%;background:var(--gold);border-radius:8px;transition:width .5s;}

/* ============ Path ============ */
.unit-banner{
  margin:22px 16px 10px;border-radius:16px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;
}
.unit-banner .u-kicker{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;font-weight:900;}
.unit-banner h2{margin:2px 0 3px;font-size:19px;font-weight:900;}
.unit-banner p{margin:0;font-size:13px;opacity:.92;}
.unit-banner .u-count{position:absolute;top:14px;right:16px;font-size:12px;font-weight:900;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:9px;}
.unit-banner .u-icon{position:absolute;bottom:-14px;right:-6px;font-size:64px;opacity:.22;transform:rotate(-12deg);}
.path{display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;}
.node-wrap{position:relative;margin:9px 0;transition:transform .2s;}
.node{
  width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:30px;position:relative;border:none;
}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-dk);}
.node.active{box-shadow:0 6px 0 rgba(0,0,0,.22);animation:nodeBreath 2s infinite;}
.node.locked{background:var(--disabled);box-shadow:0 6px 0 #d0d0d0;filter:grayscale(1);opacity:.75;cursor:default;}
.node:not(.locked):active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.2);}
@keyframes nodeBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.node .ring{position:absolute;inset:-9px;border-radius:50%;border:4px solid rgba(0,0,0,.08);}
.node.active .ring{border-color:currentColor;opacity:.35;animation:ringPulse 1.6s infinite;}
@keyframes ringPulse{0%{transform:scale(.92);opacity:.5}70%{transform:scale(1.08);opacity:0}100%{opacity:0}}
.start-tip{
  position:absolute;top:-38px;left:50%;transform:translateX(-50%);
  background:#fff;color:var(--green);border:2px solid var(--line);border-radius:10px;
  padding:4px 12px;font-size:12px;font-weight:900;letter-spacing:1px;white-space:nowrap;z-index:5;
  animation:bobble 1.2s infinite;
}
.start-tip:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);}
@keyframes bobble{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.stars{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.15);}
.node-label{text-align:center;font-size:12px;color:var(--ink-lt);font-weight:800;margin-top:14px;max-width:110px;line-height:1.2;}
.practice-cta{margin:26px 20px 8px;}
.foot-note{margin:30px 20px 10px;font-size:12px;color:#9a9a8f;text-align:center;line-height:1.5;}

/* ============ Lesson ============ */
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;}
.quit-x{background:none;font-size:22px;color:#b5b5b5;padding:4px;}
.lesson-bar{flex:1;height:16px;background:#e5e5e5;border-radius:10px;overflow:hidden;}
.lesson-bar>div{height:100%;background:var(--green);border-radius:10px;transition:width .4s;position:relative;}
.lesson-bar>div:after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.35);}
.hearts{font-size:15px;font-weight:900;color:var(--red);display:flex;gap:2px;align-items:center;}
.q-area{padding:10px 20px 170px;}
.q-title{font-size:20px;font-weight:900;color:#3c3c3c;margin:12px 0 18px;}
.q-instr{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-lt);font-weight:900;margin-top:14px;}

.opt{
  display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:14px;box-shadow:0 3px 0 var(--line);padding:13px 15px;margin:9px 0;
  font-size:16px;font-weight:800;color:var(--ink);transition:background .12s;
}
.opt .k{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink-lt);margin-right:10px;}
.opt.sel{border-color:var(--blue);background:var(--blue-lt);box-shadow:0 3px 0 var(--blue);color:var(--blue-dk);}
.opt.sel .k{border-color:var(--blue);color:var(--blue-dk);}
.opt.correct{border-color:var(--green);background:var(--green-lt);box-shadow:0 3px 0 var(--green);color:#3f8f00;}
.opt.wrong{border-color:var(--red);background:var(--red-lt);box-shadow:0 3px 0 var(--red);color:var(--red-dk);animation:shake .4s;}
.opt:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf-row{display:flex;gap:12px;}
.tf-row .opt{text-align:center;font-size:18px;}

.sentence{font-size:19px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;line-height:2;}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid #bbb;text-align:center;color:var(--blue-dk);font-weight:900;padding:0 6px;cursor:pointer;}
.blank.filled{border-bottom-color:var(--blue);}
.bank{display:flex;flex-wrap:wrap;gap:10px;}
.chip{
  background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);
  padding:9px 16px;font-size:16px;font-weight:800;color:var(--ink);
}
.chip:active{transform:translateY(3px);box-shadow:none;}
.chip.used{opacity:.35;pointer-events:none;}
.seq-zone{min-height:52px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 4px;margin-bottom:16px;}
.seq-zone .chip{background:var(--blue-lt);border-color:var(--blue);color:var(--blue-dk);}
.seq-num{font-size:12px;opacity:.6;margin-right:4px;}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mchip{
  background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);
  padding:12px 10px;font-size:14.5px;font-weight:800;color:var(--ink);min-height:56px;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.mchip.sel{border-color:var(--blue);background:var(--blue-lt);color:var(--blue-dk);box-shadow:0 3px 0 var(--blue);}
.mchip.lock{border-color:var(--green);background:var(--green-lt);color:#3f8f00;opacity:.45;pointer-events:none;}
.mchip.bad{border-color:var(--red);background:var(--red-lt);animation:shake .4s;}

/* ============ Footer / feedback ============ */
.lesson-foot{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:#fff;border-top:2px solid var(--line);padding:14px 20px 18px;z-index:60;
}
.lesson-foot.ok{background:var(--green-lt);border-top-color:var(--green-lt);}
.lesson-foot.bad{background:var(--red-lt);border-top-color:var(--red-lt);}
.fb{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;}
.fb .fb-ico{font-size:28px;line-height:1;}
.fb h3{margin:0 0 2px;font-size:18px;font-weight:900;}
.fb p{margin:0;font-size:14px;font-weight:700;}
.fb.ok h3,.fb.ok p{color:#3f8f00;}
.fb.bad h3,.fb.bad p{color:var(--red-dk);}
.combo-toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:80;
  background:var(--gold);color:#7a5b00;font-weight:900;padding:8px 18px;border-radius:20px;
  box-shadow:0 4px 0 var(--gold-dk);font-size:15px;opacity:0;pointer-events:none;transition:opacity .3s, top .3s;
}
.combo-toast.show{opacity:1;top:84px;}

/* ============ Tips (lesson intro) ============ */
.tips-card{margin:14px 20px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;}
.tips-card h2{margin:0 0 4px;font-size:21px;font-weight:900;color:#3c3c3c;}
.tips-card .sub{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-lt);font-weight:900;}
.tip-line{display:flex;gap:10px;margin:14px 0;font-size:15.5px;font-weight:700;color:var(--ink);}
.tip-line .dot{flex:0 0 auto;font-size:17px;}
.dragon-say{display:flex;align-items:flex-end;gap:8px;padding:6px 20px 0;}
.bubble{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:800;color:var(--ink);position:relative;margin-bottom:16px;}
.bubble:after{content:"";position:absolute;left:-8px;bottom:12px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);}

/* ============ Results ============ */
.results-wrap{text-align:center;padding:40px 24px 20px;}
.results-wrap h2{font-size:26px;font-weight:900;color:var(--gold-dk);margin:12px 0 4px;}
.res-cards{display:flex;gap:10px;justify-content:center;margin:22px 0;}
.res-card{border-radius:14px;padding:3px;min-width:105px;color:#fff;font-weight:900;}
.res-card .rc-lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 0 2px;}
.res-card .rc-val{background:#fff;border-radius:0 0 12px 12px;padding:10px 6px;font-size:20px;}
.rc-xp{background:var(--gold);}.rc-xp .rc-val{color:var(--gold-dk);}
.rc-acc{background:var(--green);}.rc-acc .rc-val{color:var(--green-dk);}
.rc-cmb{background:var(--blue);}.rc-cmb .rc-val{color:var(--blue-dk);}
.quote{margin:8px auto 26px;max-width:360px;font-size:16px;font-style:italic;color:var(--ink-lt);font-weight:700;}
.quote b{display:block;font-style:normal;font-size:13px;margin-top:6px;color:#9a9a8f;}
.big-stars{font-size:40px;letter-spacing:2px;margin-top:6px;}

/* ============ Modal ============ */
.modal-bg{position:fixed;inset:0;background:rgba(60,60,60,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:18px;max-width:360px;width:100%;padding:24px;text-align:center;}
.modal h3{margin:6px 0 8px;font-size:20px;font-weight:900;}
.modal p{font-size:15px;color:var(--ink-lt);margin:0 0 18px;}
.modal .btn{margin-top:8px;}
.modal .m-ico{font-size:44px;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;}
.pop-in{animation:popIn .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.slide-in{animation:slideIn .3s ease-out;}
@keyframes slideIn{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div id="tq-back" style="max-width:520px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:center;">
  <a href="members-main-zh.html" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#777;text-decoration:none;padding:6px 12px;border:2px solid #e5e5e5;border-radius:12px;background:#fff;">&#8592; 會員專區</a>
  <a href="dragons-way-quest.html" lang="en" hreflang="en" style="display:inline-flex;align-items:center;font-size:14px;font-weight:800;color:#a8842f;text-decoration:none;padding:6px 12px;border:2px solid #e8d9b0;border-radius:12px;background:#fff;">EN</a>
</div>

<div class="app">

  <!-- ================= HOME ================= -->
  <div id="home" class="screen active">
    <div class="top-stats">
      <div class="stat-pill stat-streak"><span class="em" id="flameEm">🔥</span><span id="streakVal">0</span></div>
      <div class="stat-pill stat-xp"><span class="em">⚡</span><span id="xpVal">0</span> XP</div>
      <button class="snd-btn" id="sndBtn" title="開啟／關閉聲音">🔊</button>
      <div class="stat-pill stat-lvl" id="lvlVal">氣之幼苗</div>
    </div>
    <div class="hero">
      <div id="dragonHero"></div>
      <div>
        <h1>龍之道闖關學習</h1>
        <p>一次一課，學習 Nan Lu 大師的教導。</p>
      </div>
    </div>
    <div class="daily">
      <div class="lbl"><span>🎯 每日目標</span><span id="goalLbl">0 / 30 XP</span></div>
      <div class="bar"><div id="goalBar" style="width:0%"></div></div>
    </div>
    <div id="pathArea"></div>
    <div class="foot-note">教育內容整理自 Nan Lu 大師的《龍之道氣功®指南》、五行意識課程與 TCM World 教學資料庫。並非醫療建議。</div>
  </div>

  <!-- ================= TIPS ================= -->
  <div id="tips" class="screen">
    <div class="lesson-top">
      <button class="quit-x" onclick="goHome()">✕</button>
      <div class="lesson-bar"><div style="width:0%"></div></div>
    </div>
    <div class="dragon-say">
      <div id="dragonTips"></div>
      <div class="bubble" id="tipsBubble">準備好了嗎？先讀這些，再來證明你學會了！</div>
    </div>
    <div class="tips-card pop-in" id="tipsCard"></div>
    <div style="padding:0 20px;"><button class="btn" id="tipsStart">開始上課</button></div>
  </div>

  <!-- ================= LESSON ================= -->
  <div id="lesson" class="screen">
    <div class="lesson-top">
      <button class="quit-x" id="quitBtn">✕</button>
      <div class="lesson-bar"><div id="lessonBar" style="width:0%"></div></div>
      <div class="hearts" id="heartsBox"></div>
    </div>
    <div class="q-area" id="qArea"></div>
    <div class="lesson-foot" id="lessonFoot">
      <div id="fbZone"></div>
      <button class="btn" id="checkBtn" disabled>檢查</button>
    </div>
  </div>

  <!-- ================= RESULTS ================= -->
  <div id="results" class="screen">
    <div class="results-wrap">
      <div id="dragonWin"></div>
      <div class="big-stars" id="resStars"></div>
      <h2 id="resTitle">完成這一課！</h2>
      <div class="res-cards">
        <div class="res-card rc-xp"><div class="rc-lbl">總 XP</div><div class="rc-val" id="resXp">0</div></div>
        <div class="res-card rc-acc"><div class="rc-lbl">正確率</div><div class="rc-val" id="resAcc">0%</div></div>
        <div class="res-card rc-cmb"><div class="rc-lbl">最佳連擊</div><div class="rc-val" id="resCmb">0</div></div>
      </div>
      <div class="quote" id="resQuote"></div>
      <div style="max-width:340px;margin:0 auto;"><button class="btn" onclick="goHome()">繼續</button></div>
    </div>
  </div>

  <div class="combo-toast" id="comboToast"></div>

  <!-- Quit modal -->
  <div class="modal-bg" id="quitModal">
    <div class="modal">
      <div class="m-ico">🐉</div>
      <h3>等等，別走！</h3>
      <p>你會失去這一課的進度。</p>
      <button class="btn blue" id="keepBtn">繼續學習</button>
      <button class="btn ghost" id="reallyQuitBtn" style="color:var(--red);">離開</button>
    </div>
  </div>

  <!-- Out of hearts modal -->
  <div class="modal-bg" id="heartsModal">
    <div class="modal">
      <div class="m-ico">💔</div>
      <h3>愛心用完了！</h3>
      <p>你的氣有點低了。複習一下提示，再挑戰這一課——龍相信你做得到。</p>
      <button class="btn" id="retryBtn">再試一次</button>
      <button class="btn ghost" id="heartsHomeBtn">回到路線</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>
</div>

<script>
"use strict";
/* =====================================================
   CONTENT — distilled from Grand Master Nan Lu's
   teachings (Dragon's Way Qigong guidebook, Five Element
   Consciousness course, TCM World library transcripts)
   ===================================================== */
const QUOTES=[
 ["身體是自然的縮影。","Nan Lu 大師"],
 ["一切都是能量，而一切都相互連結。","Nan Lu 大師"],
 ["症狀是身體請求支持的方式。","龍之道氣功"],
 ["治療健康，而不是疾病。","小道教導"],
 ["答案在你之內。","Nan Lu 大師"],
 ["沒有什麼是偶然的。","五行教導"],
 ["身體從不說謊。","Nan Lu 大師"],
 ["我早就把她放下了——你卻背了她一整天。","和尚的故事：放下"],
 ["健康是和諧的副產品。","TCM World 教導"],
 ["以正面的方式運用你的能量，讓你的生活更美好。","Nan Lu 大師"]
];

const UNITS=[];

/* ---------------- UNIT 1 ---------------- */
UNITS.push({
 title:"萬物皆是能量",
 desc:"氣、兩個能量帳戶，以及身體的訊息",
 color:"var(--green)", dark:"var(--green-dk)", icon:"⚡",
 lessons:[
 {title:"什麼是氣？", icon:"⚡",

const $=id=>document.getElementById(id);
const LEVELS=[[0,"氣之幼苗"],[120,"能量學徒"],[300,"經絡探索者"],[600,"五行達人"],[1000,"養氣者"],[1500,"龍之大師"]];
const GOAL=30;

/* ---------- state ---------- */
let state={xp:0,streak:0,lastDay:"",xpToday:0,xpDay:"",sound:true,done:{},mistakes:[]};
function save(){try{localStorage.setItem("dwq_quest_v1",JSON.stringify(state));}catch(e){}}
function load(){try{const s=localStorage.getItem("dwq_quest_v1");if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function yesterday(){const d=new Date(Date.now()-864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------- utils ---------- */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function levelFor(xp){let t=LEVELS[0][1];for(const[n,l]of LEVELS){if(xp>=n)t=l;}return t;}

/* ---------- sound ---------- */
let AC=null;
function tone(f,dur,type,when,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(vol||0.18,AC.currentTime+when+0.015);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+when+dur);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+dur+0.05);}
function sfx(kind){
  if(!state.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    if(kind==="click")tone(650,0.06,"sine",0,0.08);
    else if(kind==="ok"){tone(660,0.12,"sine",0);tone(880,0.16,"sine",0.1);}
    else if(kind==="bad"){tone(190,0.22,"sawtooth",0,0.12);}
    else if(kind==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,0.18,"sine",i*0.12,0.16));}
    else if(kind==="match"){tone(760,0.09,"sine",0,0.1);}
  }catch(e){}
}

/* ---------- flatten lessons ---------- */
const FLAT=[];
UNITS.forEach((u,ui)=>u.lessons.forEach((l,li)=>FLAT.push({ui,li})));
function keyOf(ui,li){return ui+"-"+li;}
function firstOpenIdx(){for(let i=0;i<FLAT.length;i++){const f=FLAT[i];if(!state.done[keyOf(f.ui,f.li)])return i;}return FLAT.length;}

/* ---------- home ---------- */
function refreshStats(){
  $("streakVal").textContent=state.streak;
  $("xpVal").textContent=state.xp;
  $("lvlVal").textContent=levelFor(state.xp);
  $("flameEm").className=state.lastDay===today()?"em flame-on":"em";
  if(state.xpDay!==today()){state.xpToday=0;state.xpDay=today();}
  $("goalLbl").textContent=Math.min(state.xpToday,GOAL)+" / "+GOAL+" XP"+(state.xpToday>=GOAL?" ✓":"");
  $("goalBar").style.width=Math.min(100,state.xpToday/GOAL*100)+"%";
  $("sndBtn").textContent=state.sound?"🔊":"🔇";
}
function renderHome(){
  refreshStats();
  $("dragonHero").innerHTML=dragonSVG(64,"happy");
  const open=firstOpenIdx();
  let html="",g=0;
  const offs=[0,-70,-95,-70,0,70,95,70];
  UNITS.forEach((u,ui)=>{
    const doneCnt=u.lessons.reduce((n,_,li)=>n+(state.done[keyOf(ui,li)]?1:0),0);
    html+='<div class="unit-banner" style="background:linear-gradient(135deg,'+u.color+','+u.dark+');">'
        +'<div class="u-kicker">第 '+(ui+1)+' 單元</div><h2>'+esc(u.title)+'</h2><p>'+esc(u.desc)+'</p>'
        +'<div class="u-count">'+doneCnt+' / '+u.lessons.length+'</div><div class="u-icon">'+u.icon+'</div></div>';
    html+='<div class="path">';
    u.lessons.forEach((l,li)=>{
      const idx=g++,k=keyOf(ui,li);
      const st=state.done[k]?"done":(idx===open?"active":(idx<open?"done":"locked"));
      const off=offs[idx%offs.length];
      const stars=state.done[k]?'<div class="stars">'+"⭐".repeat(state.done[k])+'</div>':"";
      const tip=st==="active"?'<div class="start-tip">開始</div>':"";
      const style=st==="active"?'style="background:'+u.color+';color:'+u.color+';"':(st==="done"?"":"");
      html+='<div class="node-wrap" style="transform:translateX('+off+'px)">'
          +tip
          +'<button class="node '+st+'" '+style+' onclick="tryStart('+ui+','+li+','+idx+')"><span class="ring"></span><span>'
          +(st==="locked"?"🔒":l.icon)+'</span>'+stars+'</button>'
          +'<div class="node-label">'+esc(l.title)+'</div></div>';
    });
    html+='</div>';
  });
  if(state.mistakes.length){
    html+='<div class="practice-cta"><button class="btn blue" onclick="startPractice()">🛠️ 練習你答錯的 '+state.mistakes.length+' 題</button></div>';
  }
  if(firstOpenIdx()>=FLAT.length){
    html+='<div class="practice-cta" style="text-align:center;font-weight:900;color:var(--gold-dk);font-size:18px;">🏆 You completed the whole path — Dragon Master!</div>';
  }
  $("pathArea").innerHTML=html;
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0);}
function goHome(){renderHome();show("home");}

/* ---------- lesson session ---------- */
var S=null; // session (var: reachable on window for debugging)
function tryStart(ui,li,idx){
  const k=keyOf(ui,li);
  if(!state.done[k]&&idx>firstOpenIdx())return;
  sfx("click");
  openTips(ui,li,false);
}
function openTips(ui,li,practice){
  const l=UNITS[ui].lessons[li];
  $("dragonTips").innerHTML=dragonSVG(56,"happy");
  $("tipsBubble").textContent=shuffle(["先讀這些，再告訴我！","平靜的心學得最快。","深呼吸，然後開始。","小步累積大大的氣！"])[0];
  let h='<div class="sub">第 '+(ui+1)+' 單元 · 第 '+(li+1)+' 課</div><h2>'+l.icon+" "+esc(l.title)+"</h2>";
  l.tips.forEach(t=>{h+='<div class="tip-line"><span class="dot">🐉</span><span>'+t+"</span></div>";});
  $("tipsCard").innerHTML=h;
  $("tipsStart").onclick=()=>{sfx("click");startLesson(ui,li,false);};
  show("tips");
}
function startLesson(ui,li,practice){
  const l=UNITS[ui].lessons[li];
  S={ui,li,practice:false,queue:shuffle(l.questions.map((q,qi)=>({q,ref:keyOf(ui,li)+"-"+qi}))),
     total:l.questions.length,cleared:0,hearts:5,answers:0,correct:0,combo:0,bestCombo:0,xp:0,heartsLost:0,cur:null,mode:"idle"};
  show("lesson");
  nextQ();
}
function startPractice(){
  sfx("click");
  const picks=shuffle(state.mistakes).slice(0,10);
  const qs=picks.map(ref=>{const[a,b,c]=ref.split("-").map(Number);return {q:UNITS[a].lessons[b].questions[c],ref};});
  if(!qs.length)return;
  S={ui:-1,li:-1,practice:true,queue:shuffle(qs),total:qs.length,cleared:0,hearts:null,
     answers:0,correct:0,combo:0,bestCombo:0,xp:0,heartsLost:0,cur:null,mode:"idle"};
  show("lesson");
  nextQ();
}
function updateBar(){
  $("lessonBar").style.width=(S.cleared/S.total*100)+"%";
  $("heartsBox").innerHTML=S.practice?'<span style="color:var(--blue);">∞ 練習</span>'
    :"❤️".repeat(S.hearts)+'<span style="filter:grayscale(1);opacity:.45;">'+"❤️".repeat(5-S.hearts)+"</span>";
}
function nextQ(){
  if(!S.queue.length){finishLesson();return;}
  S.cur=S.queue.shift();
  S.mode="answering";S.sel=null;
  updateBar();
  renderQ(S.cur.q);
  setFoot("check",null);
}

/* ---------- renderers ---------- */
function renderQ(q){
  const A=$("qArea");
  let h="";
  if(q.t==="mc"){
    h+='<div class="q-instr">選出最佳答案</div><div class="q-title">'+q.q+"</div>";
    S.mcMap=shuffle(q.opts.map((o,i)=>({o,i})));
    S.mcMap.forEach((m,i)=>{h+='<button class="opt" data-i="'+i+'" onclick="pickOpt(this)"><span class="k">'+(i+1)+"</span>"+esc(m.o)+"</button>";});
  }
  else if(q.t==="tf"){
    h+='<div class="q-instr">True or false?</div><div class="q-title">'+q.q+'</div><div class="tf-row">'
      +'<button class="opt" data-v="true" onclick="pickOpt(this)">✅ 正確</button>'
      +'<button class="opt" data-v="false" onclick="pickOpt(this)">❌ 錯誤</button></div>';
  }
  else if(q.t==="fill"){
    S.fillVal=null;
    const parts=q.q.split("___");
    h+='<div class="q-instr">完成這個句子</div>'
      +'<div class="sentence">'+esc(parts[0])+'<span class="blank" id="blankSlot" onclick="clearBlank()">&nbsp;</span>'+esc(parts[1]||"")+"</div>"
      +'<div class="bank">'+shuffle(q.bank).map(w=>'<button class="chip" onclick="fillWord(this)" data-w="'+esc(w)+'">'+esc(w)+"</button>").join("")+"</div>";
  }
  else if(q.t==="order"){
    S.seq=[];
    let items=shuffle(q.items);
    if(items.join("|")===q.items.join("|"))items=shuffle(q.items);
    h+='<div class="q-instr">依正確順序點選</div><div class="q-title">'+q.q+"</div>"
      +'<div class="seq-zone" id="seqZone"></div>'
      +'<div class="bank" id="seqBank">'+items.map(w=>'<button class="chip" onclick="seqAdd(this)" data-w="'+esc(w)+'">'+esc(w)+"</button>").join("")+"</div>";
  }
  else if(q.t==="match"){
    S.matchLeft=null;S.matchDone=0;
    const L=shuffle(q.pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
    h+='<div class="q-instr">點選配對的組合</div><div class="q-title">'+q.q+"</div><div class='match-grid'>";
    const rows=Math.max(L.length,R.length);
    for(let r=0;r<rows;r++){
      h+=L[r]?'<button class="mchip" data-side="L" data-i="'+L[r].i+'" onclick="matchTap(this)">'+esc(L[r].t)+"</button>":"<span></span>";
      h+=R[r]?'<button class="mchip" data-side="R" data-i="'+R[r].i+'" onclick="matchTap(this)">'+esc(R[r].t)+"</button>":"<span></span>";
    }
    h+="</div>";
  }
  A.innerHTML='<div class="slide-in">'+h+"</div>";
}

/* ---------- interactions ---------- */
function pickOpt(el){
  if(S.mode!=="answering")return;
  sfx("click");
  document.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
  S.sel=el;
  $("checkBtn").disabled=false;
}
function fillWord(el){
  if(S.mode!=="answering")return;
  sfx("click");
  document.querySelectorAll(".bank .chip").forEach(c=>c.classList.remove("used"));
  el.classList.add("used");
  S.fillVal=el.dataset.w;
  const b=$("blankSlot");b.textContent=S.fillVal;b.classList.add("filled");
  $("checkBtn").disabled=false;
}
function clearBlank(){
  if(S.mode!=="answering")return;
  S.fillVal=null;
  const b=$("blankSlot");if(b){b.innerHTML="&nbsp;";b.classList.remove("filled");}
  document.querySelectorAll(".bank .chip").forEach(c=>c.classList.remove("used"));
  $("checkBtn").disabled=true;
}
function seqAdd(el){
  if(S.mode!=="answering")return;
  sfx("click");
  el.classList.add("used");
  S.seq.push(el.dataset.w);
  renderSeq();
  $("checkBtn").disabled=S.seq.length!==S.cur.q.items.length;
}
function seqRemove(i){
  if(S.mode!=="answering")return;
  const w=S.seq.splice(i,1)[0];
  const chips=document.querySelectorAll("#seqBank .chip");
  for(const c of chips){if(c.dataset.w===w&&c.classList.contains("used")){c.classList.remove("used");break;}}
  renderSeq();
  $("checkBtn").disabled=true;
}
function renderSeq(){
  $("seqZone").innerHTML=S.seq.map((w,i)=>'<button class="chip" onclick="seqRemove('+i+')"><span class="seq-num">'+(i+1)+"</span>"+esc(w)+"</button>").join("");
}
function matchTap(el){
  if(S.mode!=="answering")return;
  const side=el.dataset.side;
  if(side==="L"){
    document.querySelectorAll('.mchip[data-side="L"]').forEach(c=>c.classList.remove("sel"));
    el.classList.add("sel");S.matchLeft=el;sfx("click");return;
  }
  if(!S.matchLeft){el.classList.add("bad");setTimeout(()=>el.classList.remove("bad"),400);return;}
  if(el.dataset.i===S.matchLeft.dataset.i){
    sfx("match");
    el.classList.add("lock");S.matchLeft.classList.remove("sel");S.matchLeft.classList.add("lock");
    S.matchLeft=null;S.matchDone++;
    if(S.matchDone===S.cur.q.pairs.length){answer(true,"配對完美！");}
  }else{
    sfx("bad");
    el.classList.add("bad");S.matchLeft.classList.add("bad");
    const L=S.matchLeft;
    setTimeout(()=>{el.classList.remove("bad");L.classList.remove("bad");},450);
  }
}

/* ---------- check / feedback ---------- */
function setFoot(mode,ok){
  const f=$("lessonFoot"),b=$("checkBtn"),z=$("fbZone");
  if(mode==="check"){
    f.className="lesson-foot";z.innerHTML="";
    b.textContent="檢查";b.disabled=true;b.className="btn";
    b.onclick=doCheck;
    if(S.cur.q.t==="match")b.style.visibility="hidden";else b.style.visibility="visible";
  }else{
    b.style.visibility="visible";
    f.className="lesson-foot "+(ok?"ok":"bad");
    b.textContent="繼續";b.disabled=false;b.className="btn "+(ok?"":"red");
    b.onclick=proceed;
  }
}
function doCheck(){
  if(S.mode!=="answering")return;
  const q=S.cur.q;let ok=false,detail="";
  if(q.t==="mc"){const m=S.mcMap[Number(S.sel.dataset.i)];ok=m.i===q.a;
    if(ok)S.sel.classList.replace("sel","correct");
    else{S.sel.classList.replace("sel","wrong");
      document.querySelectorAll(".opt").forEach(o=>{const mm=S.mcMap[Number(o.dataset.i)];if(mm&&mm.i===q.a)o.classList.add("correct");});
      detail=q.opts[q.a];}
    document.querySelectorAll(".opt").forEach(o=>o.disabled=true);}
  else if(q.t==="tf"){ok=(S.sel.dataset.v==="true")===q.a;
    if(ok)S.sel.classList.replace("sel","correct");else S.sel.classList.replace("sel","wrong");
    detail=q.a?"正確":"錯誤";
    document.querySelectorAll(".opt").forEach(o=>o.disabled=true);}
  else if(q.t==="fill"){ok=S.fillVal===q.a;detail=q.a;
    const b=$("blankSlot");b.style.color=ok?"var(--green-dk)":"var(--red-dk)";}
  else if(q.t==="order"){ok=S.seq.join("|")===q.items.join("|");detail=q.items.join(" → ");}
  answer(ok,detail);
}
function answer(ok,detail){
  S.mode="feedback";S.answers++;
  const q=S.cur.q;
  if(ok){
    S.correct++;S.cleared++;S.combo++;S.bestCombo=Math.max(S.bestCombo,S.combo);
    const gain=S.practice?5:10;S.xp+=gain;
    sfx("ok");
    if(S.combo>=3){const t=$("comboToast");t.textContent="🔥 連續答對 "+S.combo+" 題！+"+gain+" XP";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1300);}
    if(S.practice){const i=state.mistakes.indexOf(S.cur.ref);if(i>-1){state.mistakes.splice(i,1);save();}}
    $("fbZone").innerHTML='<div class="fb ok"><div class="fb-ico">✅</div><div><h3>'+shuffle(["太棒了！","做得好！","答對了！","你的氣很強！","太美了！"])[0]+"</h3><p>"+(q.why||"")+"</p></div></div>";
  }else{
    S.combo=0;
    sfx("bad");
    if(!S.practice){
      if(!state.mistakes.includes(S.cur.ref)){state.mistakes.push(S.cur.ref);save();}
      S.hearts--;S.heartsLost++;
    }
    S.queue.push(S.cur); // requeue until mastered
    const corr=detail?'<b>答案：'+esc(detail)+"</b><br>":"";
    $("fbZone").innerHTML='<div class="fb bad"><div class="fb-ico">❌</div><div><h3>差一點……</h3><p>'+corr+(q.why||"")+"</p></div></div>";
    updateBar();
    if(!S.practice&&S.hearts<=0){setFoot("continue",false);$("checkBtn").style.visibility="hidden";setTimeout(()=>$("heartsModal").classList.add("show"),650);return;}
  }
  updateBar();
  setFoot("continue",ok);
}
function proceed(){sfx("click");nextQ();}

/* ---------- finish ---------- */
function finishLesson(){
  $("comboToast").classList.remove("show");
  const acc=S.answers?Math.round(S.correct/S.answers*100):100;
  const perfect=S.heartsLost===0&&!S.practice;
  if(perfect)S.xp+=20;
  state.xp+=S.xp;
  if(state.xpDay!==today()){state.xpToday=0;state.xpDay=today();}
  state.xpToday+=S.xp;
  if(!S.practice){
    const k=keyOf(S.ui,S.li);
    const stars=S.heartsLost===0?3:(S.heartsLost<=2?2:1);
    state.done[k]=Math.max(state.done[k]||0,stars);
    $("resStars").textContent="⭐".repeat(stars);
  }else{$("resStars").textContent="🛠️";}
  const t=today();
  if(state.lastDay!==t){state.streak=(state.lastDay===yesterday())?state.streak+1:1;state.lastDay=t;}
  save();
  $("dragonWin").innerHTML=dragonSVG(110,"win");
  $("resTitle").textContent=S.practice?"練習完成！":(perfect?"完美的一課！":"完成這一課！");
  $("resXp").textContent="+"+S.xp;
  $("resAcc").textContent=acc+"%";
  $("resCmb").textContent=S.bestCombo;
  const qu=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  $("resQuote").innerHTML="“"+esc(qu[0])+"”<b>— "+esc(qu[1])+"</b>";
  show("results");
  sfx("win");
  confetti();
}

/* ---------- confetti ---------- */
function confetti(){
  const c=$("confetti"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#58cc02","#1cb0f6","#ffc800","#ff4b4b","#ce82ff","#ff9600"];
  const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,r:4+Math.random()*6,co:cols[Math.floor(Math.random()*cols.length)],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,ro:Math.random()*Math.PI,vr:-0.1+Math.random()*0.2}));
  let t=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.ro+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.ro);x.fillStyle=p.co;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);x.restore();});
    t++;
    if(t<180)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- modals / misc ---------- */
$("quitBtn").onclick=()=>{$("quitModal").classList.add("show");};
$("keepBtn").onclick=()=>{$("quitModal").classList.remove("show");};
$("reallyQuitBtn").onclick=()=>{$("quitModal").classList.remove("show");goHome();};
$("retryBtn").onclick=()=>{$("heartsModal").classList.remove("show");openTips(S.ui,S.li,false);};
$("heartsHomeBtn").onclick=()=>{$("heartsModal").classList.remove("show");goHome();};
$("sndBtn").onclick=()=>{state.sound=!state.sound;save();refreshStats();if(state.sound)sfx("click");};

document.addEventListener("keydown",e=>{
  if(!$("lesson").classList.contains("active"))return;
  if(e.key==="Enter"){const b=$("checkBtn");if(!b.disabled&&b.style.visibility!=="hidden")b.click();}
  if(S&&S.mode==="answering"&&/^[1-9]$/.test(e.key)){
    const opts=document.querySelectorAll(".opt");
    const i=Number(e.key)-1;
    if(opts[i])pickOpt(opts[i]);
  }
});

/* ---------- boot ---------- */
load();
renderHome();
</script>
