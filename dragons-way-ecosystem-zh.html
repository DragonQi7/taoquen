<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍之道生態系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f2; --card:#fffdf8; --line:#ddd5be; --ink:#2c2c28; --muted:#6f6550;
  --gold:#c8901a; --gold-d:#8b6914; --gold-l:#f3e7cc;
  --serif:'Playfair Display','Noto Serif TC',Georgia,serif;
  --sans:'Inter','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --caps:'Cinzel','Noto Serif TC',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:rgba(250,248,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar a{text-decoration:none}
.back{font-size:.9rem;font-weight:600;color:var(--gold-d);padding:6px 4px}
.back:hover{text-decoration:underline}
.bar-title{font-family:var(--caps);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.82rem;font-weight:600;color:#fff;background:var(--gold);padding:6px 16px;border-radius:999px}
.pill:hover{background:var(--gold-d)}

/* ---------- intro ---------- */
.intro{max-width:1120px;margin:0 auto;padding:44px 24px 8px;text-align:center}
.eyebrow{font-family:var(--caps);font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d)}
.intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.15;margin:10px 0 10px}
.intro p{max-width:620px;margin:0 auto;color:var(--muted);font-size:1.05rem}
.demo-note{display:inline-block;margin-top:14px;font-size:.8rem;color:var(--muted);background:var(--gold-l);border-radius:999px;padding:4px 14px}

.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:28px auto 0;padding:0 16px}
.tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px 8px 8px;font-size:.92rem;font-weight:500;color:var(--ink);transition:.2s}
.tab .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold-l);color:var(--gold-d);font-weight:700;font-size:.8rem}
.tab:hover{border-color:var(--gold)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-selected="true"] .n{background:var(--gold);color:#fff}

.stage{max-width:1120px;margin:28px auto 80px;padding:0 24px}

/* ---------- wizard ---------- */
.wiz{display:grid;grid-template-columns:240px 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px -30px rgba(80,60,20,.35)}
.steps{list-style:none;margin:0;padding:22px 0;background:#f4efe2;border-right:1px solid var(--line)}
.steps li{display:flex;align-items:center;gap:12px;padding:9px 22px;font-size:.9rem;color:var(--muted);transition:.25s}
.steps .dot{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #cbbf9f;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:#fff;transition:.25s}
.steps li.on{color:var(--ink);font-weight:600;background:#fff}
.steps li.on .dot{border-color:var(--gold);background:var(--gold);color:#fff}
.steps li.done .dot{border-color:var(--gold-d);background:var(--gold-d);color:#fff}
.wbody{padding:34px 40px 26px;display:flex;flex-direction:column;min-height:470px}
.wcount{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);font-weight:600}
.wq{font-family:var(--serif);font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:600;line-height:1.25;margin:6px 0 22px}
.fields{flex:1;display:flex;flex-direction:column;gap:14px}
.fl{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp{min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:11px 14px;font-size:.98rem;line-height:1.55;transition:border-color .2s,box-shadow .2s}
.inp.area{min-height:118px}
.inp.typing{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,144,26,.13)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slot{aspect-ratio:4/3;border:1.5px dashed #cbbf9f;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;background:#fbf8f0;color:#b5a57e;font-size:1.6rem}
.slot img,.slot .mono{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .45s,transform .6s}
.slot.in img,.slot.in .mono{opacity:1;transform:none}
.slot .mono{display:grid;place-items:center;font-family:var(--serif);font-size:2.4rem;color:#fff}
.slot-l{font-size:.78rem;color:var(--muted);text-align:center;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;background:#fff;transition:.25s}
.chip.hl{border-color:var(--gold)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tg{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1.5px solid var(--line);border-radius:12px;padding:14px 18px;background:#fff}
.tg b{display:block;font-weight:600}
.tg small{color:var(--muted);font-size:.84rem}
.sw{flex:none;width:50px;height:28px;border-radius:999px;background:#d9d1bd;position:relative;transition:.3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.3s}
.sw.on{background:var(--gold)}
.sw.on::after{left:25px}
.sw-l{font-size:.78rem;font-weight:600;margin-top:4px;text-align:center;color:var(--muted);min-width:50px}
.evrow{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;opacity:0;transform:translateY(8px);transition:.4s}
.evrow.in{opacity:1;transform:none}
.evrow .dt{flex:none;width:78px;font-size:.78rem;font-weight:600;color:var(--gold-d)}
.evrow .tt{font-size:.92rem}
.wfoot{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid #eee5d2}
.prog{flex:1;height:5px;background:#eee5d2;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:.86rem;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.primary:hover{background:var(--gold-d);border-color:var(--gold-d)}

/* building */
.build{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:46px 40px;max-width:720px;margin:0 auto;box-shadow:0 20px 50px -30px rgba(80,60,20,.35)}
.build h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:0 0 22px;display:flex;align-items:center;gap:14px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--gold-l);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.build ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.build li{display:flex;gap:12px;align-items:flex-start;font-size:.98rem;opacity:0;transform:translateX(-8px);transition:.4s}
.build li.in{opacity:1;transform:none}
.build li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;margin-top:2px}

/* site toolbar */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.tools .sp{flex:1}
.ntoggle{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;background:none;border:0;padding:4px;color:var(--ink)}
.ans{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:16px;display:none}
.ans.open{display:block}
.ans h3{font-family:var(--serif);font-weight:600;margin:0 0 14px;font-size:1.2rem}
.ans dl{display:grid;grid-template-columns:170px 1fr;gap:8px 18px;margin:0;font-size:.92rem}
.ans dt{font-weight:600;color:var(--muted)}
.ans dd{margin:0}

/* browser frame */
.frame{border:1px solid #cfc6b0;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 70px -35px rgba(40,30,10,.45)}
.chrome{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#ece8de;border-bottom:1px solid #d7cfbc}
.chrome .dots{display:flex;gap:6px}
.chrome .dots i{width:11px;height:11px;border-radius:50%;background:#d0c6b0}
.url{flex:1;background:#fff;border-radius:7px;padding:5px 12px;font-size:.8rem;color:#6d6656;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url b{color:#2c2c28;font-weight:500}

/* ---------- generated site ---------- */
.site{--c1:#56705a;--c2:#b8693f;--sbg:#f6f2ea;--sink:#2b2a26;--soft:#e7e0d2;background:var(--sbg);color:var(--sink);font-family:var(--sans)}
.site section{padding:64px 7%;position:relative}
.site h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.2;margin:0 0 10px}
.site .kick{font-family:var(--caps);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--c2);margin-bottom:8px}
.snav{display:flex;align-items:center;gap:20px;padding:16px 7%;background:var(--sbg);border-bottom:1px solid var(--soft)}
.slogo{font-family:var(--serif);font-weight:700;font-size:1.12rem;color:var(--c1);flex:1;line-height:1.2}
.slinks{display:flex;gap:20px;font-size:.88rem}
.slinks a{text-decoration:none;opacity:.8}
.slinks a:hover{opacity:1;color:var(--c2)}
.scta{background:var(--c2);color:#fff;text-decoration:none;font-weight:600;font-size:.86rem;padding:9px 18px;border-radius:999px;white-space:nowrap;border:0}
.scta.ghost{background:transparent;color:var(--c1);border:1.5px solid var(--c1)}
.shero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-top:56px!important;padding-bottom:64px!important}
.shero h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,3.8vw,3rem);line-height:1.13;margin:0 0 18px;color:var(--c1)}
.shero p{font-size:1.06rem;opacity:.85;margin:0 0 26px;max-width:540px}
.shero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hpic{position:relative}
.hpic img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:200px 200px 18px 18px;display:block}
.badge{position:absolute;left:-18px;bottom:28px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);font-size:.85rem;font-weight:600;max-width:90%}
.mono{border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:600;flex:none}
.badge .mono{width:42px;height:42px;font-size:1rem}
.sdw{background:#fff}
.story{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start;margin-top:26px}
.story .big{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.3vw,1.7rem);line-height:1.4;color:var(--c1);border-left:3px solid var(--c2);padding-left:22px;margin:0}
.story .rest p{margin:0 0 14px;font-size:1rem;opacity:.88}
.story .rest p.inv{opacity:1;font-weight:600;color:var(--c1);font-size:1.06rem;margin-top:20px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.pcard{background:#fff;border:1px solid var(--soft);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:8px}
.pcard.lead{border:2px solid var(--c2);box-shadow:0 18px 40px -26px rgba(0,0,0,.4)}
.pcard .lv{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:600}
.pcard h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0;line-height:1.25;color:var(--c1)}
.pcard .tg2{font-style:italic;font-family:var(--serif);opacity:.85}
.pcard p{margin:0;font-size:.93rem;opacity:.85}
.pcard .wk{margin-top:auto;padding-top:10px;font-size:.8rem;font-weight:600;color:var(--c2)}
.start{align-self:flex-start;background:var(--c2);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.leadline{font-size:.88rem;background:var(--sbg);border-radius:10px;padding:10px 12px;margin-top:4px!important;opacity:1!important}
.me{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start;background:#fff}
.me .mono{width:150px;height:150px;font-size:3rem;box-shadow:0 0 0 8px var(--soft)}
.me .who{font-size:.92rem;opacity:.75;margin-bottom:12px}
.me blockquote{margin:22px 0 0;background:var(--sbg);border-radius:14px;padding:22px 26px;font-family:var(--serif);font-style:italic;font-size:1.08rem;line-height:1.55}
.me blockquote b{display:block;font-family:var(--sans);font-style:normal;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c2);margin-bottom:6px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;grid-column:1/-1}
.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;display:block}
.faqs{max-width:780px;margin-top:22px}
.faqs details{border-bottom:1px solid var(--soft);padding:16px 0}
.faqs summary{cursor:pointer;font-weight:600;font-size:1.04rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faqs summary::-webkit-details-marker{display:none}
.faqs summary::after{content:"+";color:var(--c2);font-size:1.3rem;line-height:1}
.faqs details[open] summary::after{content:"−"}
.faqs p{margin:10px 0 0;opacity:.85}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.post{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--soft);display:flex;flex-direction:column}
.post img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.post div{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.post h3{font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.3;margin:0}
.post p{margin:0;font-size:.9rem;opacity:.8}
.post a{margin-top:auto;font-size:.85rem;font-weight:600;color:var(--c2);text-decoration:none}
.evwrap{display:grid;grid-template-columns:280px 1fr;gap:28px;margin-top:24px;align-items:start}
.cal{background:#fff;border:1px solid var(--soft);border-radius:14px;padding:18px}
.cal h4{margin:0 0 10px;font-family:var(--serif);font-weight:600;text-align:center;color:var(--c1)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:.78rem}
.cal .g span{padding:5px 0;border-radius:6px}
.cal .g .h{font-weight:700;opacity:.55}
.cal .g .e{background:var(--c2);color:#fff;font-weight:700}
.evs{display:grid;gap:12px}
.ev{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--soft);border-radius:14px;padding:14px 18px}
.ev .tile{flex:none;width:62px;text-align:center;border-radius:10px;background:var(--c1);color:#fff;padding:6px 0}
.ev .tile small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ev .tile b{font-family:var(--serif);font-size:1.5rem;line-height:1.1}
.ev .info{flex:1;min-width:0}
.ev .info b{display:block;font-size:.98rem;line-height:1.35}
.ev .info span{font-size:.84rem;opacity:.7}
.free{display:inline-block;margin-left:6px;background:var(--soft);color:var(--c1);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
.ev .scta{padding:7px 14px;font-size:.8rem}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#fff}
.cform{display:grid;gap:12px}
.cform label{font-size:.8rem;font-weight:600;opacity:.75}
.cform .f{border:1.5px solid var(--soft);border-radius:10px;height:44px;background:var(--sbg)}
.cform .f.t{height:100px}
.cinfo{background:var(--c1);color:#fff;border-radius:16px;padding:28px 30px;display:grid;gap:14px;align-content:start}
.cinfo div{font-size:.95rem}
.cinfo small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.sfoot{background:var(--c1);color:rgba(255,255,255,.85);padding:30px 7%;font-size:.84rem;display:flex;flex-wrap:wrap;gap:10px 30px;justify-content:space-between}
.sfoot b{color:#fff;font-family:var(--serif);font-size:1rem}

/* marketing notes */
.note{display:none;position:absolute;top:14px;right:14px;z-index:5;max-width:300px;background:#fff8e1;border:1px solid #e9cf86;color:#4a3b12;border-radius:10px;padding:10px 13px;font-size:.8rem;line-height:1.45;box-shadow:0 10px 24px -14px rgba(0,0,0,.4);font-family:var(--sans)}
.note b{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#a07a12;margin-bottom:3px}
.show-notes .note{display:block}
.show-notes .site section{outline:2px dashed rgba(200,144,26,.45);outline-offset:-8px}

.hidden{display:none!important}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .wiz{grid-template-columns:1fr}
  .steps{display:flex;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line);gap:4px;scrollbar-width:none}
  .steps li{padding:6px 10px;white-space:nowrap;border-radius:999px;font-size:.8rem}
  .steps li:not(.on) span:not(.dot){display:none}
  .wbody{padding:24px 20px 20px;min-height:430px}
  .slinks{display:none}
  .shero,.story,.contact,.evwrap{grid-template-columns:1fr}
  .shero{gap:32px}
  .hpic{max-width:420px}
  .badge{left:10px}
  .pgrid,.posts{grid-template-columns:1fr}
  .me{grid-template-columns:1fr}
  .me .mono{width:110px;height:110px;font-size:2.3rem}
  .story{gap:22px}
  .note{position:relative;top:auto;right:auto;max-width:none;margin-bottom:16px}
  .ans dl{grid-template-columns:1fr;gap:2px}
  .ans dd{margin-bottom:10px}
}
@media (max-width:560px){
  .bar{padding:10px 16px}
  .bar-title{display:none}
  .intro,.stage{padding-left:16px;padding-right:16px}
  .tab{padding:6px 14px 6px 6px;font-size:.84rem}
  .photos{gap:8px}
  .site section{padding:44px 20px}
  .snav{padding:14px 20px}
  .snav .scta{display:none}
  .gal{grid-template-columns:1fr 1fr}
  .gal img:last-child{display:none}
  .ev{display:grid;grid-template-columns:62px 1fr;gap:6px 16px;align-items:start}
  .ev .scta{grid-column:2;justify-self:start}
  .build{padding:30px 22px}
  .wfoot{flex-wrap:wrap}
  .prog{flex-basis:100%;order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="back" id="back" href="#"></a>
  <div class="bar-title" id="barTitle"></div>
  <a class="pill" id="pill" href="#"></a>
</header>

<div class="intro">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>

        if (!paused) t += 40;
        setTimeout(tick, 40);
      })();
    });
  }
  async function type(el, text, r){
    el.classList.add('typing');
    if (reduce){ el.textContent = text; el.classList.remove('typing'); return; }

    for (let i = 0; i <= text.length; i += per){
      el.innerHTML = esc(text.slice(0, i)) + caret;
      await sleep(40, r);

    el.innerHTML = esc(text);
    el.classList.remove('typing');

        F.innerHTML = '<div class="photos">' + U.photoLabels.map((l, i) =>
          '<div><div class="slot">+' + (i === 0 ? '<div class="mono" style="background:' + e.theme.c1 + '">' + esc(e.initials) + '</div>' : '<img alt="" src="' + e.photos[i] + '">') +
          '</div><div class="slot-l">' + esc(l) + '</div></div>').join('') + '</div>';
        for (const sl of F.querySelectorAll('.slot')){ await sleep(520, r); sl.classList.add('in'); }
        break;
      case 4:
        F.innerHTML = '<div><div class="fl">' + esc(U.fieldNiche) + '</div><div class="chips">' +
          U.nicheChips.map(c => '<span class="chip">' + esc(c) + '</span>').join('') + '</div></div>' + field(U.fieldAudience, true);
        const chips = F.querySelectorAll('.chip');
        for (let i = 0; i <= e.niche; i++){ chips.forEach(c => c.classList.remove('hl')); chips[i].classList.add('hl'); await sleep(260, r); }
        chips[e.niche].classList.remove('hl'); chips[e.niche].classList.add('on');
        await sleep(350, r); await type($('.inp', F), e.audience, r); break;
      case 5:
        F.innerHTML = [[U.faqOpt, U.faqHint], [U.blogOpt, U.blogHint]].map(t =>
          '<div class="tg"><div><b>' + esc(t[0]) + '</b><small>' + esc(t[1]) + '</small></div><div><div class="sw"></div><div class="sw-l">' + esc(U.no) + '</div></div></div>').join('');
        const sws = F.querySelectorAll('.tg');
        for (const [i, v] of [[0, e.faq], [1, e.blog]]){
          await sleep(650, r);
          if (v){ $('.sw', sws[i]).classList.add('on'); }
          $('.sw-l', sws[i]).textContent = v ? U.yes : U.no;
        }
        break;
      case 6:
        F.innerHTML = field(U.contactEmail) + field(U.contactPhone) + field(U.contactWhere);
        els = F.querySelectorAll('.inp');
        await type(els[0], e.email, r); await type(els[1], e.phone, r); await type(els[2], e.where, r); break;
      case 7:
        F.innerHTML = e.events.map(ev => '<div class="evrow"><div class="dt">' + esc(fmt(ev.d, {month: 'short', day: 'numeric'})) + '</div><div class="tt">' + esc(ev.title) + '</div></div>').join('');
        for (const row of F.querySelectorAll('.evrow')){ await sleep(480, r); row.classList.add('in'); }
        break;
    }
  }
  async function building(e, r){
    stage.innerHTML = '<div class="build fade"><h2><span class="spin"></span>' + esc(U.building) + '</h2><ul>' +
      e.build.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul></div>';
    for (const li of stage.querySelectorAll('li')){ await sleep(reduce ? 0 : 520, r); li.classList.add('in'); }
    await sleep(900, r);
  }

  async function start(i, toSite){
    run++; const r = run; cur = i; paused = false; setTabs();
    if (toSite){ showSite(); return; }
    phase = 'wiz'; setPill();
    const e = EX(i);
    wizShell();
    try {
      for (let s = 0; s < 8; s++){
        setStep(s);
        await animStep(s, e, r);
        await sleep(750, r);
      }
      $('#prog').style.width = '100%';
      await sleep(300, r);
      await building(e, r);
      showSite();
    } catch (err) { /* cancelled */ }
  }

  // ---------- generated site ----------
  function note(e, k){
    const t = e.notes[k]; if (!t) return '';
    return '<div class="note"><b>' + esc(U.noteLabel) + '</b>' + esc(t) + '</div>';
  }
  function cal(e){
    const f = dObj(e.events[0].d), y = f.getFullYear(), m = f.getMonth();
    const first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
    const hit = new Set(e.events.map(v => dObj(v.d)).filter(d => d.getMonth() === m && d.getFullYear() === y).map(d => d.getDate()));
    let g = U.days.map(d => '<span class="h">' + d + '</span>').join('');
    for (let i = 0; i < first; i++) g += '<span></span>';
    for (let d = 1; d <= n; d++) g += '<span' + (hit.has(d) ? ' class="e"' : '') + '>' + d + '</span>';
    return '<div class="cal"><h4>' + esc(new Intl.DateTimeFormat(U.locale, {month: 'long', year: 'numeric'}).format(f)) + '</h4><div class="g">' + g + '</div></div>';
  }
  function siteHTML(e){
    const N = U.nav, order = [e.lead].concat([0, 1, 2].filter(x => x !== e.lead));
    const links = [['about', N.about], ['programs', N.programs]].concat(e.faq ? [['faq', N.faq]] : [], e.blog ? [['blog', N.blog]] : [], [['events', N.events], ['contact', N.contact]]);
    const mono = (sz) => '<div class="mono"' + (sz ? ' style="width:' + sz + 'px;height:' + sz + 'px"' : '') + '>' + esc(e.initials) + '</div>';
    let h = '<nav class="snav"><div class="slogo">' + esc(e.site) + '</div><div class="slinks">' +
      links.map(l => '<a href="#s-' + l[0] + '">' + esc(l[1]) + '</a>').join('') +
      '</div><a class="scta" href="#s-contact">' + esc(e.hero.cta) + '</a></nav>';
    h += '<section class="shero">' + note(e, 'hero') + '<div><div class="kick">' + esc(e.hero.eyebrow) + '</div><h1>' + esc(e.hero.h1) + '</h1><p>' + esc(e.hero.sub) +
      '</p><div class="ctas"><a class="scta" href="#s-contact">' + esc(e.hero.cta) + '</a><a class="scta ghost" href="#s-programs">' + esc(e.hero.cta2) + '</a></div></div>' +
      '<div class="hpic"><img alt="" src="' + e.photos[1] + '"><div class="badge">' + mono() + '<span>' + esc(e.person) + '</span></div></div></section>';
    h += '<section class="sdw" id="s-about">' + note(e, 'about') + '<div class="kick">Dragon\'s Way Qigong®</div><h2>' + esc(U.dwAbout) + '</h2><div class="story"><p class="big">' + esc(e.story[0]) +
      '</p><div class="rest">' + e.story.slice(1).map((p, i, a) => '<p' + (i === a.length - 1 ? ' class="inv"' : '') + '>' + esc(p) + '</p>').join('') + '</div></div></section>';
    h += '<section id="s-programs">' + note(e, 'programs') + '<div class="kick">' + esc(U.progTitle) + '</div><h2>' + esc(U.progSub) + '</h2><div class="pgrid">' +
      order.map(k => '<div class="pcard' + (k === e.lead ? ' lead' : '') + '">' + (k === e.lead ? '<span class="start">' + esc(U.startHere) + '</span>' : '') +
        '<div class="lv">' + esc(U.level[k]) + '</div><h3>' + esc(P[k].name) + '</h3><div class="tg2">' + esc(P[k].tag) + '</div><p>' + esc(P[k].body) + '</p>' +
        (k === e.lead ? '<p class="leadline">' + esc(e.leadLine) + '</p>' : '') + '<div class="wk">' + esc(U.weeks) + '</div></div>').join('') + '</div></section>';
    h += '<section class="me">' + note(e, 'me') + mono() + '<div><div class="kick">' + esc(U.meet) + '</div><h2>' + esc(e.person) + '</h2><div class="who">' + esc(e.location) +
      '</div><p style="margin:0">' + esc(e.bio) + '</p><blockquote><b>' + esc(U.whyTitle) + '</b>“' + esc(e.why) + '”</blockquote></div>' +
      '<div class="gal">' + e.photos.concat([]).reverse().map(p => '<img alt="" src="' + p + '">').join('') + '</div></section>';
    if (e.faq) h += '<section id="s-faq">' + note(e, 'faq') + '<div class="kick">' + esc(N.faq) + '</div><h2>' + esc(U.faqTitle) + '</h2><div class="faqs">' +
      e.faqs.map((q, i) => '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(q[0]) + '</summary><p>' + esc(q[1]) + '</p></details>').join('') + '</div></section>';
    if (e.blog) h += '<section id="s-blog" style="background:#fff">' + note(e, 'blog') + '<div class="kick">' + esc(N.blog) + '</div><h2>' + esc(U.blogTitle) + '</h2><div class="posts">' +
      e.posts.map((p, i) => '<article class="post"><img alt="" src="' + e.photos[(i + 1) % 3] + '"><div><h3>' + esc(p[0]) + '</h3><p>' + esc(p[1]) + '</p><a href="#s-blog">' + esc(U.readMore) + '</a></div></article>').join('') + '</div></section>';
    h += '<section id="s-events">' + note(e, 'events') + '<div class="kick">' + esc(N.events) + '</div><h2>' + esc(U.eventsTitle) + '</h2><div class="evwrap">' + cal(e) + '<div class="evs">' +
      e.events.map(ev => '<div class="ev"><div class="tile"><small>' + esc(fmt(ev.d, {month: 'short'})) + '</small><b>' + dObj(ev.d).getDate() + '</b></div><div class="info"><b>' + esc(ev.title) +
        (ev.free ? '<span class="free">' + FREE + '</span>' : '') + '</b><span>' + esc(fmt(ev.d, {weekday: 'short'})) + ' · ' + esc(ev.t) + ' · ' + esc(ev.where) + '</span></div><a class="scta" href="#s-contact">' + esc(U.register) + '</a></div>').join('') +
      '</div></div></section>';
    h += '<section class="contact" id="s-contact">' + note(e, 'contact') + '<div><div class="kick">' + esc(N.contact) + '</div><h2>' + esc(U.contactTitle) + '</h2><div class="cform">' +
      '<label>' + esc(U.formName) + '</label><div class="f"></div><label>' + esc(U.formEmail) + '</label><div class="f"></div><label>' + esc(U.formMsg) + '</label><div class="f t"></div>' +
      '<div><button class="scta" type="button">' + esc(U.formSend) + '</button> <small style="opacity:.6">' + esc(U.formDemo) + '</small></div></div></div>' +
      '<div class="cinfo"><div><small>' + esc(U.contactEmail) + '</small>' + esc(e.email) + '</div><div><small>' + esc(U.contactPhone) + '</small>' + esc(e.phone) +
      '</div><div><small>' + esc(U.contactWhere) + '</small>' + esc(e.where) + '</div></div></section>';
    h += '<footer class="sfoot"><div><b>' + esc(e.site) + '</b><br>' + esc(U.footer) + '</div><div>' + esc(U.powered) + '</div></footer>';
    return h;
  }
  function answers(e){
    const rows = [[U.steps[0], e.site + ' — ' + e.person + ' · ' + e.location], [U.steps[1], e.bio], [U.steps[2], e.why],
      [U.steps[4], U.nicheChips[e.niche] + ' — ' + e.audience],
      [U.steps[5], U.faqOpt + ': ' + (e.faq ? U.yes : U.no) + ' · ' + U.blogOpt + ': ' + (e.blog ? U.yes : U.no)],
      [U.steps[6], e.email + ' · ' + e.phone + ' · ' + e.where],
      [U.steps[7], e.events.map(v => fmt(v.d, {month: 'short', day: 'numeric'}) + ' ' + v.title).join(' / ')]];
    return '<h3>' + esc(U.answersTitle) + '</h3><dl>' + rows.map(x => '<dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl>';
  }
  function showSite(){
    phase = 'site'; setPill(); setTabs();
    const e = EX(cur);
    stage.innerHTML = '<div class="fade"><div class="tools"><button class="btn" id="replay"></button><button class="btn" id="ansBtn"></button><span class="sp"></span>' +
      '<button class="ntoggle" id="nt"><span class="sw" id="ntsw"></span><span></span></button></div>' +
      '<div class="ans" id="ans">' + answers(e) + '</div>' +
      '<div class="frame" id="frame"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">https://<b>' + esc(e.domain) + '</b></div></div>' +
      '<div class="site" id="site">' + siteHTML(e) + '</div></div></div>';
    $('#replay').textContent = U.replay;
    $('#ansBtn').textContent = U.answers;
    $('#nt span:last-child').textContent = U.notes;
    $('#replay').onclick = () => start(cur);
    $('#ansBtn').onclick = () => $('#ans').classList.toggle('open');
    $('#nt').onclick = () => { const on = $('#frame').classList.toggle('show-notes'); $('#ntsw').classList.toggle('on', on); };
    const s = $('#site'), t = e.theme;
    s.style.setProperty('--c1', t.c1); s.style.setProperty('--c2', t.c2); s.style.setProperty('--sbg', t.bg);
    s.style.setProperty('--sink', t.ink); s.style.setProperty('--soft', t.soft);
    s.querySelectorAll('a[href^="#s-"]').forEach(a => a.onclick = ev => { ev.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 70, behavior: 'smooth'}); });
    const top = $('.tools').getBoundingClientRect().top + scrollY - 70;
    if (scrollY > top) window.scrollTo({top: top});
  }

  // ---------- boot ----------
  function fromHash(){
    const m = /ex=(\d)/.exec(location.hash), i = m ? Math.min(3, Math.max(1, +m[1])) - 1 : 0;
    return [i, /view=site/.test(location.hash)];
  }
  const [i0, site0] = fromHash();
  start(i0, site0);
})();
</script>
</body>
</html>
