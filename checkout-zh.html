<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報名將於 8 月 20 日開放 — Taoquen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --jade:       #55160A;
      --jade-light: #C02026;
      --gold:       #C8901A;
      --dark:       #E9E4DA;
      --text:       #1a0804;
      --muted:      #6b4030;
    }
    body {
      font-family: 'Inter',Noto Sans TC,sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(85,22,10,0.10);
    }
    .eyebrow {
      font-family: 'Cinzel',Noto Serif TC,serif;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--jade-light);
      margin-bottom: 20px;
      display: block;
    }
    .lock-icon {
      font-size: 2.8rem;
      margin-bottom: 20px;
      display: block;
    }
    h1 {
      font-family: 'Playfair Display',Noto Serif TC,serif;
      font-size: 1.9rem;
      color: var(--jade);
      line-height: 1.25;
      margin-bottom: 12px;
    }
    h1 em { color: var(--gold); font-style: normal; }
    .date-badge {
      display: inline-block;
      background: var(--gold);
      color: #fff;
      font-family: 'Cinzel',Noto Serif TC,serif;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 40px;
      margin: 20px 0 28px;
    }
    p {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .waitlist-label {
      font-family: 'Cinzel',Noto Serif TC,serif;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }
    .mailto-link {
      display: inline-block;
      background: var(--jade);
      color: #fff8f4;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .mailto-link:hover { background: #7a1e0e; }
    .back-link {
      display: block;
      margin-top: 28px;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--jade); }
    .divider {
      border: none;
      border-top: 1px solid rgba(85,22,10,0.1);
      margin: 32px 0;
    }
    .note {
      font-size: 0.76rem;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style id="tq-zh">
  html{font-synthesis:weight;}
  body{letter-spacing:.01em;}
</style>
<link rel="alternate" hreflang="en" href="checkout.html">
</head>
<body>

  <div class="card">
    <span class="eyebrow">龍之道氣功® • 報名</span>
    <span class="lock-icon">🔒</span>
    <h1>報名開放日期<br><em>2026 年 8 月 20 日</em></h1>
    <div class="date-badge">8 月 20 日開放報名 • 9 月 3 日開課</div>
    <p>下一梯次龍之道氣功® 尚未開放報名。加入候補名單，名額一開放我們就會立即寄信通知你。</p>

    <span class="waitlist-label">加入候補名單</span>
    <!-- TODO: Replace [YOUR-EMAIL] with your actual email address -->
    <a class="mailto-link" href="mailto:[YOUR-EMAIL]?subject=DWQ%20Waitlist&body=Hi%2C%20I'd%20like%20to%20join%20the%20waitlist%20for%20Dragon's%20Way%20Qigong.">寄信加入候補名單 →</a>

    <hr class="divider">
    <a class="back-link" href="dwq-promo-zh.html">← 返回龍之道氣功®</a>
    <p style="margin:0 0 12px;"><a href="checkout.html" class="lang-switch" lang="en" hreflang="en" style="display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 11px;font-size:.78rem;line-height:1.4;white-space:nowrap;opacity:.85;text-decoration:none;">EN</a></p>
    <p class="note" style="margin-top:16px;margin-bottom:0;">絕不濫發郵件。開放報名時只寄一封通知。</p>
  </div>

</body>
</html>
